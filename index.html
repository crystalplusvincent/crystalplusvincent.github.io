<!DOCTYPE html>
<html lang="en">

    <!-- ================================= -->
    <!-- AUTUMN BACKGROUND                 -->
    <!-- ================================= -->

    <div
        id="autumn-background"
        aria-hidden="true"
    >

        <!-- Pixel clouds -->

        <div class="cloud cloud-one"></div>
        <div class="cloud cloud-two"></div>
        <div class="cloud cloud-three"></div>


        <!-- Falling leaves are generated here -->

        <div id="leaf-layer"></div>

    </div>



    <!-- ================================= -->
    <!-- COUNT-UP CLOCK                    -->
    <!-- ================================= -->

    <main id="container">

        <h1>Chicago</h1>


        <div id="counter">

            <span id="year">
                0 Years
            </span>

            <span id="day">
                0 Days
            </span>

            <span id="hour">
                0 Hours
            </span>

            <span id="minute">
                0 Minutes
            </span>

            <span id="second">
                0 Seconds
            </span>

        </div>


        <div id="subtitle">
            Chicago
        </div>


        <div id="images"></div>

    </main>
