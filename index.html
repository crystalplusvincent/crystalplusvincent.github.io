<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" href="assets/favicon.ico" />

  <title>crystalplusvincent</title>

  <link rel="stylesheet" href="style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <script src="script.js" defer></script>
</head>

<body>

  <!-- =========================================
       STARRY SKY
       Stars are generated automatically in CSS/JS.
  ========================================== -->

  <div id="star-field" aria-hidden="true"></div>


  <!-- =========================================
       RELATIONSHIP COUNTER
  ========================================== -->

  <main id="container">

    <div id="counter">

      <p id="year" class="timer">00 Years</p>

      <p id="day" class="timer">00 Days</p>

      <p id="hour" class="timer">00 Hours</p>

      <p id="minute" class="timer">00 Minutes</p>

      <p id="second" class="timer">00 Seconds</p>

    </div>

  </main>


  <!-- =========================================
       CHICAGO SKYLINE
  ========================================== -->

  <div class="skyline" aria-hidden="true">


    <!-- LEFT SIDE -->

    <div class="building building-small"></div>

    <div class="building building-medium">
      <div class="roof-step"></div>
    </div>

    <div class="building building-short"></div>

    <div class="building building-medium-tall"></div>

    <div class="building building-small"></div>


    <!-- WILLIS TOWER -->

    <div class="willis">

      <div class="willis-antenna antenna-left"></div>
      <div class="willis-antenna antenna-right"></div>

      <div class="willis-level willis-level-1"></div>
      <div class="willis-level willis-level-2"></div>
      <div class="willis-level willis-level-3"></div>

    </div>


    <!-- MID LEFT -->

    <div class="building building-short"></div>

    <div class="building building-medium"></div>

    <div class="building building-small"></div>

    <div class="building building-tall-thin"></div>

    <div class="building building-short"></div>

    <div class="building building-medium">
      <div class="tiny-antenna"></div>
    </div>

    <div class="building building-small"></div>


    <!-- CENTER -->

    <div class="building building-medium-tall"></div>

    <div class="building building-short"></div>

    <div class="building building-medium"></div>

    <div class="building building-small"></div>


    <!-- POINTED TOWER -->

    <div class="point-tower">
      <div class="point-roof"></div>
    </div>


    <div class="building building-medium"></div>

    <div class="building building-short"></div>


    <!-- AON-STYLE TOWER -->

    <div class="aon"></div>


    <div class="building building-small"></div>

    <div class="building building-medium"></div>

    <div class="building building-short"></div>

    <div class="building building-medium-tall"></div>

    <div class="building building-small"></div>


    <!-- HANCOCK -->

    <div class="hancock">

      <div class="hancock-antenna hancock-left"></div>
      <div class="hancock-antenna hancock-right"></div>

      <div class="hancock-body"></div>

    </div>


    <!-- RIGHT SIDE -->

    <div class="building building-short"></div>

    <div class="building building-medium"></div>

    <div class="building building-small"></div>

    <div class="building building-medium-tall"></div>

    <div class="building building-short"></div>

  </div>


  <script>
    /*
      -----------------------------------------
      STAR GENERATOR
      -----------------------------------------

      Creates the same style of 8-point stars:
      a + superimposed over an X.

      Change STAR_COUNT if you want more/fewer.
    */

    const starField = document.getElementById("star-field");

    const STAR_COUNT = 115;

    for (let i = 0; i < STAR_COUNT; i++) {

      const star = document.createElement("span");

      star.classList.add("star");

      /*
        Keep stars primarily in the upper
        portion of the page.
      */

      const x = Math.random() * 100;
      const y = Math.random() * 68;

      /*
        Mostly tiny stars.
        A few are slightly larger.
      */

      const sizeChance = Math.random();

      let size;

      if (sizeChance > 0.94) {
        size = 6;
      }

      else if (sizeChance > 0.72) {
        size = 4;
      }

      else {
        size = 2;
      }

      /*
        Random twinkle speeds keep the sky
        from pulsing all at once.
      */

      const duration =
        2.5 + Math.random() * 3.5;

      const delay =
        Math.random() * -5;

      star.style.left = x + "%";
      star.style.top = y + "%";

      star.style.setProperty(
        "--star-size",
        size + "px"
      );

      star.style.setProperty(
        "--twinkle-duration",
        duration + "s"
      );

      star.style.setProperty(
        "--twinkle-delay",
        delay + "s"
      );

      starField.appendChild(star);
    }
  </script>

</body>
</html>
